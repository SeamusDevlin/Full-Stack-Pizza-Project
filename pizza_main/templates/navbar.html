{% load static %}

<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Pizza Order">
    <title>Pizza Order</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/other.css' %}">
    <script type="text/javascript" src="{% static 'js/main.js' %}" defer></script>

</head>
<body>
    <header class="header">
       <nav class="nav container">
          <div class="nav__data">
             <a href="/home" class="nav__logo">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed"><path d="M480-80 80-680q85-72 186.5-116T480-840q112 0 213.5 43.5T880-680L480-80Zm0-144 292-438q-65-45-139-71.5T480-760q-79 0-152.5 26.5T188-662l292 438ZM380-560q25 0 42.5-17.5T440-620q0-25-17.5-42.5T380-680q-25 0-42.5 17.5T320-620q0 25 17.5 42.5T380-560Zm100 200q25 0 42.5-17.5T540-420q0-25-17.5-42.5T480-480q-25 0-42.5 17.5T420-420q0 25 17.5 42.5T480-360Zm0 136Z"/></svg> 404 Pizza
             </a>
             
             <div class="nav__toggle" id="nav-toggle">
                <i class="ri-menu-line nav__burger"></i>
                <i class="ri-close-line nav__close"></i>
             </div>
          </div>

          <div class="nav__menu" id="nav-menu">
             <ul class="nav__list">
                <li><a href="/home" class="nav__link">Home</a></li>

                <li><a href="/create" class="nav__link">Order</a></li>

                
                <li><a href="/menu" class="nav__link">Menu</a></li>

                <li><a href="/history" class="nav__link">History</a></li>

                <li class="dropdown__item">
                   <div class="nav__link">
                      FAQ <i class="ri-arrow-down-s-line dropdown__arrow"></i>
                   </div>

                   <ul class="dropdown__menu">

                      <li>
                         <a href="/payment" class="dropdown__link">
                            <i class="ri-bank-card-line"></i> Payment Method
                         </a>
                      </li>

                      <li>
                         <a href="/contact" class="dropdown__link">
                            <i class="ri-message-3-line"></i> Contact Us
                         </a>
                      </li>
                   </ul>

               {% if user.is_authenticated %}
                   <li><a href="/logout" class="nav__link">Log Out</a></li>
               {% else %}
                   <li><a href="/login" class="nav__link">Login</a></li>
               {% endif %}
                </li>

             </ul>
          </div>
       </nav>
    </header>
    
    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
